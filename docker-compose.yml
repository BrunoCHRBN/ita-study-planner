services:
  postgres:
    image: postgres:16-alpine
    container_name: ita_study_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ita_user
      POSTGRES_PASSWORD: ita_password
      POSTGRES_DB: ita_study_db
    ports:
      - "5432:5432"
    volumes:
      - ita_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ita_user -d ita_study_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ita_pgdata:
